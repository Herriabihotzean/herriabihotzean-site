<!DOCTYPE html>
<html data-title-eu="Historia" data-title-fr="Histoire" lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Histoire — Herria Bihotzean</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:white;background:linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.70)),url("fond-herriabihotzean.jpg") center/cover fixed}
.page{width:min(900px,calc(100% - 28px));margin:0 auto;padding:60px 0}.contenu{padding:28px;border-radius:8px;background:rgba(0,0,0,.58);text-align:center}
h1{font-size:clamp(2.1rem,7vw,4rem);margin:0 0 28px;text-transform:uppercase}
.liens{display:grid;gap:16px;max-width:700px;margin:auto}.carte{display:flex;align-items:center;justify-content:center;min-height:90px;padding:16px;border:1px solid rgba(255,255,255,.60);border-radius:8px;background:rgba(20,55,32,.88);color:white;text-decoration:none;font-weight:bold;font-size:1.12rem}
.carte:hover{background:white;color:rgb(20,55,32)}.retour{margin-top:28px}.retour a{color:white}
</style><link href="langues.css" rel="stylesheet"></head>
<body><main class="page"><section class="contenu"><h1>Histoire</h1><nav class="liens">
<a class="carte" id="histoire-basques-link" href="https://herriabihotzean.github.io/histoire-des-basques/">Histoire des Basques</a>
<a class="carte" id="saints-link" href="https://herriabihotzean.github.io/herriabihotzean-saints-pays-basque/">Les saints du Pays Basque</a>
</nav><p class="retour"><a href="index.html">← Retour à l’accueil</a></p></section></main>
<script src="langues.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const lang=localStorage.getItem("herria_langue")==="eu"?"eu":"fr";
 const h1=document.querySelector("h1"),b=document.getElementById("histoire-basques-link"),s=document.getElementById("saints-link"),r=document.querySelector(".retour a");
 if(lang==="eu"){h1.textContent="Historia";b.textContent="Eskualdunen historia";s.textContent="Eskual Herriko sainduak";r.textContent="← Harrera-horrirat itzuli"}
 [b,s].forEach(a=>a.addEventListener("click",e=>{e.preventDefault();location.href=a.href+"?lang="+lang}));
});
</script></body></html>
