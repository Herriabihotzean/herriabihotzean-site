<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title id="titre-document">
    Produit — Herria Bihotzean
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px 12px 50px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: white;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.46),
          rgba(0, 0, 0, 0.58)
        ),
        url("fond-herriabihotzean.jpg")
        center / cover fixed;
    }

    .page {
      width: min(1100px, 96%);
      margin: 0 auto;
    }

    /* =========================
       LANGUES
       ========================= */

    .barre-langues {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 18px;
    }

    .bouton-langue {
      display: flex;
      align-items: center;
      gap: 8px;

      border: 1px solid
        rgba(255, 255, 255, 0.45);

      border-radius: 8px;

      padding: 7px 11px;

      color: white;
      background:
        rgba(0, 0, 0, 0.32);

      font-family: inherit;
      font-size: 0.92rem;

      cursor: pointer;
    }

    .bouton-langue img {
      width: 28px;
      height: 28px;

      object-fit: contain;
    }

    .bouton-langue.actif {
      background:
        rgba(255, 255, 255, 0.18);
    }

    /* =========================
       TITRE
       ========================= */

    h1 {
      margin: 18px 0 25px;

      text-align: center;

      font-size:
        clamp(2rem, 5vw, 3.3rem);

      font-weight: normal;

      text-transform: uppercase;

      letter-spacing: 0.05em;

      text-shadow:
        0 2px 7px
        rgba(0, 0, 0, 0.8);
    }

    /* =========================
       RETOUR / PANIER
       ========================= */

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;
    }

    .bouton-navigation {
      display: inline-block;

      padding: 10px 15px;

      border: 1px solid
        rgba(255, 255, 255, 0.45);

      border-radius: 8px;

      color: white;

      background:
        rgba(0, 0, 0, 0.32);

      text-decoration: none;

      font-family: inherit;

      cursor: pointer;
    }

    .bouton-navigation:hover {
      background:
        rgba(255, 255, 255, 0.15);
    }

    /* =========================
       CARTE PRODUIT
       ========================= */

    .produit {
      padding: 28px;

      border-radius: 12px;

      background:
        rgba(0, 0, 0, 0.50);

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.25);
    }

    .chargement,
    .erreur {
      padding: 35px 15px;

      text-align: center;

      font-size: 1.1rem;
    }

    .contenu-produit {
      display: none;
    }

    /* =========================
       GALERIE
       ========================= */

    .galerie {
      width: min(650px, 100%);
      margin: 0 auto 30px;
    }

    .photo-principale {
      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 300px;

      padding: 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.08);
    }

    .photo-principale img {
      display: block;

      max-width: 100%;
      max-height: 600px;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 6px;
    }

    .photo-absente {
      padding: 80px 20px;

      text-align: center;

      opacity: 0.8;
    }

    .miniatures {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 10px;

      margin-top: 12px;
    }

    .miniature {
      width: 82px;
      height: 82px;

      padding: 4px;

      border: 1px solid
        rgba(255, 255, 255, 0.35);

      border-radius: 6px;

      background:
        rgba(0, 0, 0, 0.25);

      cursor: pointer;
    }

    .miniature img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 3px;
    }

    .miniature.active {
      border: 2px solid white;
    }

    /* =========================
       INFORMATIONS
       ========================= */

    .titre-produit {
      margin: 10px 0 8px;

      text-align: center;

      font-size:
        clamp(1.7rem, 4vw, 2.5rem);

      font-weight: normal;
    }

    .sous-titre-produit {
      margin: 0 auto 18px;

      text-align: center;

      font-style: italic;

      font-size: 1.08rem;

      opacity: 0.92;
    }

    .prix {
      margin: 14px 0;

      text-align: center;

      font-size: 1.7rem;
      font-weight: bold;
    }

    .disponibilite {
      margin: 10px 0 24px;

      text-align: center;

      font-weight: bold;
    }

    /* =========================
       PRÉSENTATION
       ========================= */

    .bloc-presentation {
      margin: 28px auto;

      width: min(850px, 100%);
    }

    .titre-section {
      margin: 0 0 15px;

      text-align: center;

      font-size: 1.35rem;
      font-weight: normal;

      text-transform: uppercase;

      letter-spacing: 0.06em;
    }

    .description {
      font-size: 1.06rem;
      line-height: 1.7;

      text-align: justify;
      text-justify: inter-word;

      white-space: pre-line;
    }

    .bloc-presentation.masque {
      display: none;
    }

    /* =========================
       INFORMATIONS PRATIQUES
       ========================= */

    .details {
      width: min(650px, 100%);
      margin: 25px auto;

      padding: 18px 20px;

      border-radius: 8px;

      background:
        rgba(255, 255, 255, 0.08);
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      padding: 7px 0;

      border-bottom: 1px solid
        rgba(255, 255, 255, 0.15);
    }

    .detail:last-child {
      border-bottom: none;
    }

    /* =========================
       AJOUT AU PANIER
       ========================= */

    .achat {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 15px;

      margin-top: 28px;
    }

    .choix-quantite {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .bouton-quantite {
      width: 38px;
      height: 38px;

      border: 1px solid
        rgba(255, 255, 255, 0.5);

      border-radius: 6px;

      color: white;

      background:
        rgba(0, 0, 0, 0.35);

      font-size: 1.25rem;

      cursor: pointer;
    }

    #quantite {
      min-width: 40px;

      text-align: center;

      font-size: 1.1rem;
    }

    #ajouter-panier {
      padding: 13px 24px;

      border: 1px solid
        rgba(255, 255, 255, 0.6);

      border-radius: 8px;

      color: white;

      background:
        rgba(0, 0, 0, 0.45);

      font-family: inherit;
      font-size: 1.08rem;

      cursor: pointer;
    }

    #ajouter-panier:hover {
      background:
        rgba(255, 255, 255, 0.16);
    }

    #ajouter-panier:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .confirmation {
      min-height: 24px;

      text-align: center;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {
      body {
        padding: 14px 8px 35px;
      }

      .produit {
        padding: 20px 15px;
      }

      .navigation {
        align-items: stretch;
      }

      .bouton-navigation {
        text-align: center;
      }

      .photo-principale {
        min-height: 220px;
      }

      .miniature {
        width: 65px;
        height: 65px;
      }

      .description {
        font-size: 1rem;
        line-height: 1.6;
      }

      .detail {
        flex-direction: column;
        gap: 3px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="barre-langues">

      <button
        type="button"
        id="langue-fr"
        class="bouton-langue"
      >
        <img
          src="blason-france.svg"
          alt=""
        >

        <span id="texte-langue-fr">
          Français
        </span>
      </button>

      <button
        type="button"
        id="langue-eu"
        class="bouton-langue"
      >
        <img
          src="blason-navarre.svg"
          alt=""
        >

        <span id="texte-langue-eu">
          Basque
        </span>
      </button>

    </div>

    <h1 id="titre-page">
      Produit
    </h1>

    <div class="navigation">

      <a
        id="retour-boutique"
        class="bouton-navigation"
        href="boutique.html"
      >
        ← Retour à la boutique
      </a>

      <a
        id="bouton-panier"
        class="bouton-navigation"
        href="panier.html"
      >
        Panier
      </a>

    </div>

    <section class="produit">

      <div
        id="chargement"
        class="chargement"
      >
        Chargement du produit…
      </div>

      <div
        id="erreur"
        class="erreur"
        hidden
      ></div>

      <div
        id="contenu-produit"
        class="contenu-produit"
      >

        <div
          id="galerie"
          class="galerie"
        >

          <div
            id="photo-principale"
            class="photo-principale"
          ></div>

          <div
            id="miniatures"
            class="miniatures"
          ></div>

        </div>

        <h2
          id="titre-produit"
          class="titre-produit"
        ></h2>

        <div
          id="sous-titre-produit"
          class="sous-titre-produit"
        ></div>

        <div
          id="prix-produit"
          class="prix"
        ></div>

        <div
          id="disponibilite-produit"
          class="disponibilite"
        ></div>

        <section
          id="bloc-presentation"
          class="bloc-presentation"
        >
          <h3
            id="titre-presentation"
            class="titre-section"
          >
            Présentation
          </h3>

          <div
            id="description-produit"
            class="description"
          ></div>
        </section>

        <div class="details">

          <div class="detail">
            <span id="libelle-expedition">
              Expédition
            </span>

            <span id="expedition-produit">
            </span>
          </div>

          <div class="detail">
            <span id="libelle-frais">
              Frais de livraison
            </span>

            <span id="frais-produit">
            </span>
          </div>

          <div class="detail">
            <span id="libelle-poids">
              Poids
            </span>

            <span id="poids-produit">
            </span>
          </div>

        </div>

        <div class="achat">

          <div class="choix-quantite">

            <button
              type="button"
              id="moins"
              class="bouton-quantite"
            >
              −
            </button>

            <span id="quantite">
              1
            </span>

            <button
              type="button"
              id="plus"
              class="bouton-quantite"
            >
              +
            </button>

          </div>

          <button
            type="button"
            id="ajouter-panier"
          >
            Ajouter au panier
          </button>

          <div
            id="confirmation"
            class="confirmation"
          ></div>

        </div>

      </div>

    </section>

  </main>

  <script src="config.js"></script>
  <script src="langues.js"></script>
  <script src="produit.js"></script>

</body>
</html>
