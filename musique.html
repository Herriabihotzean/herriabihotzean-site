<!DOCTYPE html>
<html data-title-eu="Musika — Herria Bihotzean" data-title-fr="Musique — Herria Bihotzean" lang="fr">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Musique — Herria Bihotzean
  </title>
  <style>
   *{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    min-height:100vh;
    font-family:Georgia,"Times New Roman",serif;
    color:white;
    background-image:
        linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.70)),
        url("fond-herriabihotzean.jpg");
    background-position:center;
    background-size:cover;
    background-attachment:fixed;
    background-repeat:no-repeat;
}
a{color:inherit}
.page{width:min(1000px,calc(100% - 28px));margin:0 auto}
.entete{padding:46px 16px 26px;text-align:center}
.bloc-titre{
    width:min(820px,100%);
    margin:0 auto;
    padding:30px 24px;
}
h1{margin:0;font-size:clamp(2rem,6vw,3.8rem);letter-spacing:.05em;text-transform:uppercase}
.blasons{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;margin-top:24px}
.blasons img{width:92px;height:92px;object-fit:contain}
main{padding-bottom:40px}
.intro,.contenu{
    margin:0 auto 24px;
    padding:24px;
    border-radius:8px;
    background:rgba(0,0,0,.58);
    line-height:1.65
}
.intro{text-align:center}
.intro.justifie{text-align:justify}

/*
 * Sur ordinateur, les liens sont répartis en deux colonnes
 * et suivent l’ordre vertical : haut vers bas dans la colonne
 * de gauche, puis haut vers bas dans la colonne de droite.
 */
.liens{
    column-count:2;
    column-gap:16px;
    width:min(900px,100%);
    margin:0 auto 28px;
}
.carte{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:82px;
    margin:0 0 14px;
    padding:16px;
    break-inside:avoid;
    page-break-inside:avoid;
    border:1px solid rgba(255,255,255,.60);
    border-radius:8px;
    background:rgba(20,55,32,.88);
    text-align:center;
    text-decoration:none;
    font-weight:bold;
    transition:.16s
}
.carte:hover,.carte:focus-visible{
    background:white;
    color:rgb(20,55,32);
    transform:translateY(-2px);
    outline:none
}
.sous-section{
    margin:22px 0 10px;
    font-size:1.35rem;
    text-align:center
}
.retour{text-align:center;margin:30px 0}
.retour a{
    display:inline-block;
    padding:11px 18px;
    border:1px solid white;
    border-radius:7px;
    background:rgba(0,0,0,.32);
    text-decoration:none;
    font-weight:bold
}
.retour a:hover{background:white;color:#222}
footer{
    padding:22px 14px 28px;
    border-top:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.58);
    text-align:center
}
@media(max-width:700px){
    body{background-attachment:scroll}
    .entete{padding:28px 8px 18px}
    .bloc-titre{padding:24px 14px}
    .blasons{gap:14px}
    .blasons img{width:72px;height:72px}
    .liens{column-count:1}
}
  </style>
  <link href="langues.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://herriabihotzean.fr/hb-home.css">
<script src="https://herriabihotzean.fr/hb-home.js" defer></script>
 </head>
 <body>
  <header class="entete">
   <div class="bloc-titre">
    <h1>
     Musique
    </h1>
    <div aria-label="Blasons du Labourd, de la Navarre et de la Soule" class="blasons">
     <img alt="Blason du Labourd" src="blason-labourd.svg"/>
     <img alt="Blason de la Navarre" src="blason-navarre.svg"/>
     <img alt="Blason de la Soule" src="blason-soule.svg"/>
    </div>
   </div>
  </header>
  <main class="page">
   <section class="intro">
    Cette rubrique accueillera des enregistrements, des partitions et des présentations consacrés à la musique du Pays basque.
   </section>
   <section class="contenu">
    <p>
     Les premiers contenus seront ajoutés prochainement.
    </p>
   </section>
   <div class="retour">
    <a href="index.html">
     ← Retour à l’accueil
    </a>
   </div>
  </main>
  <footer>
   © Herria Bihotzean
  </footer>
  <script src="langues.js">
  </script>
 
  <script>
  function alignerIntro() {
    const intro = document.querySelector('.intro');
    if (!intro) return;

    intro.classList.remove('justifie');

    const style = getComputedStyle(intro);
    const mesure = document.createElement('div');

    mesure.style.position = 'absolute';
    mesure.style.visibility = 'hidden';
    mesure.style.pointerEvents = 'none';
    mesure.style.left = '-99999px';
    mesure.style.top = '0';

    const largeurTexte =
      intro.clientWidth
      - parseFloat(style.paddingLeft)
      - parseFloat(style.paddingRight);

    mesure.style.width = largeurTexte + 'px';
    mesure.style.fontFamily = style.fontFamily;
    mesure.style.fontSize = style.fontSize;
    mesure.style.fontWeight = style.fontWeight;
    mesure.style.fontStyle = style.fontStyle;
    mesure.style.letterSpacing = style.letterSpacing;
    mesure.style.lineHeight = style.lineHeight;
    mesure.innerHTML = intro.innerHTML;

    document.body.appendChild(mesure);

    const lineHeight = parseFloat(style.lineHeight);

    if (mesure.scrollHeight > lineHeight * 1.4) {
      intro.classList.add('justifie');
    }

    mesure.remove();
  }

  window.addEventListener('load', function () {
    alignerIntro();
    setTimeout(alignerIntro, 100);
  });

  window.addEventListener('resize', alignerIntro);

  document.addEventListener('click', function () {
    setTimeout(alignerIntro, 50);
  });
  </script>

</body>
</html>
