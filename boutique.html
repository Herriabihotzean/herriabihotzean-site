<!DOCTYPE html>
<html
  lang="fr"
  data-title-fr="Boutique — Herria Bihotzean"
  data-title-eu="Saltokia — Herria Bihotzean"
>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Boutique — Herria Bihotzean</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: white;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.70)
        ),
        url("fond-herriabihotzean.jpg");

      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    a {
      color: inherit;
    }

    button,
    a {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(1000px, calc(100% - 28px));
      margin: 0 auto;
    }

    /*
     * Même présentation du titre que sur langue-basque.html :
     * titre seul, sans cadre ni fond.
     */
    .entete {
      padding: 46px 16px 26px;
      text-align: center;
    }

    .bloc-titre {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 30px 24px;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(2rem, 6vw, 3.8rem);

      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    main {
      padding-bottom: 40px;
    }

    .intro {
      margin: 0 auto 24px;
      padding: 24px;

      border-radius: 8px;

      background:
        rgba(0, 0, 0, 0.58);

      line-height: 1.65;
      text-align: center;
    }

    .actions-boutique {
      display: flex;
      justify-content: center;
      margin: 0 auto 30px;
    }

    .lien-panier {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 11px 18px;

      border: 1px solid white;
      border-radius: 7px;

      background:
        rgba(0, 0, 0, 0.32);

      font-weight: bold;
      text-decoration: none;
    }

    .lien-panier:hover,
    .lien-panier:focus-visible {
      background: white;
      color: #222;
      outline: none;
    }

    .nombre-panier {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 24px;
      height: 24px;
      padding: 0 6px;

      border-radius: 999px;

      background: #8f1f1f;
      color: white;

      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .etat {
      width: min(760px, 100%);
      margin: 32px auto;
      padding: 24px;

      border-radius: 8px;

      background:
        rgba(20, 55, 32, 0.90);

      text-align: center;
    }

    .etat-erreur {
      background:
        rgba(110, 25, 25, 0.94);
    }

    .roue {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;

      border:
        4px solid rgba(255, 255, 255, 0.28);

      border-top-color: white;
      border-radius: 50%;

      animation:
        tourner 0.8s linear infinite;
    }

    @keyframes tourner {
      to {
        transform: rotate(360deg);
      }
    }

    .categorie {
      margin: 42px 0 54px;
    }

    .titre-categorie {
      display: flex;
      align-items: center;
      gap: 18px;

      margin: 0 0 25px;

      font-size:
        clamp(1.55rem, 3.5vw, 2.25rem);

      font-weight: normal;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
    }

    .titre-categorie::before,
    .titre-categorie::after {
      content: "";
      flex: 1;
      height: 1px;

      background:
        rgba(255, 255, 255, 0.55);
    }

    .sous-categorie {
      margin: 30px 0;
    }

    .titre-sous-categorie {
      margin: 0 0 18px;
      padding-left: 12px;

      border-left:
        4px solid #d7b66f;

      font-size: 1.35rem;
      font-weight: normal;
    }

    .grille-produits {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;
    }

    .carte-produit {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;

      border:
        1px solid rgba(255, 255, 255, 0.60);

      border-radius: 8px;

      background:
        rgba(20, 55, 32, 0.88);

      transition: 0.16s;
    }

    .carte-produit:hover {
      transform: translateY(-2px);
    }

    .zone-photo {
      position: relative;

      width: 100%;
      aspect-ratio: 4 / 3;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.08);
    }

    .photo-produit {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: contain;

      background:
        rgba(255, 255, 255, 0.04);
    }

    .photo-absente {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;
      padding: 24px;

      color:
        rgba(255, 255, 255, 0.76);

      font-style: italic;
      text-align: center;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;

      max-width:
        calc(100% - 24px);

      padding: 7px 10px;

      border-radius: 999px;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.76rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .badge-disponible {
      background: #e8f5e9;
      color: #1d5b2b;
    }

    .badge-indisponible {
      background: #f8e5e5;
      color: #7c1f1f;
    }

    .contenu-carte {
      display: flex;
      flex: 1;
      flex-direction: column;

      padding: 21px;
    }

    .titre-produit {
      margin: 0 0 7px;

      font-size: 1.42rem;
      font-weight: normal;
      line-height: 1.25;
    }

    .sous-titre-produit {
      min-height: 1.4em;
      margin: 0 0 18px;

      color:
        rgba(255, 255, 255, 0.82);

      font-style: italic;
      line-height: 1.4;
    }

    .bas-carte {
      margin-top: auto;
    }

    .prix-produit {
      margin: 0 0 14px;

      font-size: 1.55rem;
      font-weight: bold;
    }

    .bouton-produit {
      display: block;
      width: 100%;
      padding: 13px 16px;

      border: 1px solid white;
      border-radius: 7px;

      background:
        rgba(0, 0, 0, 0.32);

      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    .bouton-produit:hover,
    .bouton-produit:focus-visible {
      background: white;
      color: #222;
      outline: none;
    }

    /*
     * Copie du bouton de retour de langue-basque.html.
     */
    .retour {
      margin: 30px 0;
      text-align: center;
    }

    .retour a {
      display: inline-block;
      padding: 11px 18px;

      border: 1px solid white;
      border-radius: 7px;

      background:
        rgba(0, 0, 0, 0.32);

      font-weight: bold;
      text-decoration: none;
    }

    .retour a:hover,
    .retour a:focus-visible {
      background: white;
      color: #222;
      outline: none;
    }

    footer {
      padding: 22px 14px 28px;

      border-top:
        1px solid rgba(255, 255, 255, 0.25);

      background:
        rgba(0, 0, 0, 0.58);

      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        background-attachment: scroll;
      }

      .entete {
        padding: 28px 8px 18px;
      }

      .bloc-titre {
        padding: 24px 14px;
      }

      .grille-produits {
        grid-template-columns: 1fr;
      }

      .titre-categorie {
        gap: 10px;
      }
    }
  </style>

  <link
    href="langues.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="https://herriabihotzean.fr/hb-home.css">
<script src="https://herriabihotzean.fr/hb-home.js" defer></script>
</head>

<body>
  <header class="entete">
    <div class="bloc-titre">
      <h1 id="titre-page">
        Boutique
      </h1>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <p id="texte-introduction">
        Découvrez les livres, enregistrements et autres
        ressources proposés par Herria Bihotzean.
      </p>
    </section>

    <div class="actions-boutique">
      <a
        id="lien-panier"
        class="lien-panier"
        href="panier.html"
      >
        <span id="texte-panier">
          Panier
        </span>

        <span
          id="nombre-panier"
          class="nombre-panier"
        >
          0
        </span>
      </a>
    </div>

    <section
      id="chargement"
      class="etat"
      aria-live="polite"
    >
      <div
        class="roue"
        aria-hidden="true"
      ></div>

      <p id="texte-chargement">
        Chargement des produits…
      </p>
    </section>

    <section
      id="erreur"
      class="etat etat-erreur"
      aria-live="assertive"
      hidden
    >
      <h2 id="titre-erreur">
        Impossible de charger la boutique
      </h2>

      <p id="message-erreur"></p>
    </section>

    <section
      id="boutique-vide"
      class="etat"
      hidden
    >
      <p id="texte-boutique-vide">
        Aucun produit n’est actuellement proposé.
      </p>
    </section>

    <div
      id="catalogue"
      aria-live="polite"
    ></div>

    <div class="retour">
      <a
        id="lien-retour"
        href="index.html"
      >
        ← Retour à l’accueil
      </a>
    </div>
  </main>

  <footer>
    © Herria Bihotzean
  </footer>

  <script src="config.js"></script>
  <script src="langues.js"></script>
  <script src="boutique.js"></script>
</body>
</html>
