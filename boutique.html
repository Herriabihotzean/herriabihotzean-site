<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Boutique — Herria Bihotzean</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --vert-fonce: #143720;
      --vert-clair: #28583a;
      --creme: #f6f3ea;
      --blanc: #ffffff;
      --rouge: #8f1f1f;
      --or: #d7b66f;
      --ombre: rgba(0, 0, 0, 0.32);
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Bell MT",
        Georgia,
        "Times New Roman",
        serif;

      color: var(--blanc);

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.66)
        ),
        url("Un dimanche d'été à Ascain.jpeg")
        center center / cover fixed;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .barre-superieure {
      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 12px 18px;

      background: rgba(20, 55, 32, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 3px 14px var(--ombre);
      backdrop-filter: blur(7px);
    }

    .marque {
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .outils {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bouton-langue,
    .bouton-panier,
    .bouton-retour {
      min-height: 40px;
      padding: 9px 14px;

      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 7px;

      background: transparent;
      color: var(--blanc);

      text-decoration: none;
      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .bouton-langue:hover,
    .bouton-langue.actif,
    .bouton-panier:hover,
    .bouton-retour:hover {
      background: var(--creme);
      color: var(--vert-fonce);
      transform: translateY(-1px);
    }

    .bouton-panier {
      position: relative;
    }

    .nombre-panier {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 24px;
      height: 24px;
      margin-left: 5px;
      padding: 0 6px;

      border-radius: 999px;

      background: var(--rouge);
      color: var(--blanc);

      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .conteneur {
      width: min(1220px, 94%);
      margin: 0 auto;
      padding: 50px 0 70px;
    }

    .introduction {
      max-width: 850px;
      margin: 0 auto 42px;
      padding: 32px 28px;

      text-align: center;

      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 14px;

      background: rgba(20, 55, 32, 0.78);
      box-shadow: 0 14px 35px var(--ombre);
      backdrop-filter: blur(5px);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: normal;
    }

    .introduction p {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .etat-chargement,
    .etat-erreur,
    .etat-vide {
      max-width: 760px;
      margin: 32px auto;
      padding: 24px;

      text-align: center;

      border-radius: 12px;
      background: rgba(20, 55, 32, 0.9);
      box-shadow: 0 8px 24px var(--ombre);
    }

    .etat-erreur {
      background: rgba(110, 25, 25, 0.94);
    }

    .roue {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;

      border: 4px solid rgba(255, 255, 255, 0.28);
      border-top-color: var(--blanc);
      border-radius: 50%;

      animation: tourner 0.8s linear infinite;
    }

    @keyframes tourner {
      to {
        transform: rotate(360deg);
      }
    }

    .categorie {
      margin: 42px 0 54px;
    }

    .titre-categorie {
      display: flex;
      align-items: center;
      gap: 18px;

      margin: 0 0 25px;

      font-size: clamp(1.6rem, 3.5vw, 2.35rem);
      font-weight: normal;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .titre-categorie::before,
    .titre-categorie::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.55);
    }

    .sous-categorie {
      margin: 30px 0;
    }

    .titre-sous-categorie {
      margin: 0 0 18px;
      padding-left: 12px;

      border-left: 4px solid var(--or);

      font-size: 1.35rem;
      font-weight: normal;
    }

    .grille-produits {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(245px, 1fr));
      gap: 25px;
    }

    .carte-produit {
      display: flex;
      flex-direction: column;
      min-height: 100%;

      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 13px;

      background: rgba(20, 55, 32, 0.9);
      box-shadow: 0 12px 30px var(--ombre);

      transition:
        transform 0.23s ease,
        box-shadow 0.23s ease;
    }

    .carte-produit:hover {
      transform: translateY(-5px);
      box-shadow: 0 17px 38px rgba(0, 0, 0, 0.43);
    }

    .zone-photo {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;

      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          rgba(0, 0, 0, 0.14)
        );
    }

    .photo-produit {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;

      transition: transform 0.35s ease;
    }

    .carte-produit:hover .photo-produit {
      transform: scale(1.035);
    }

    .photo-absente {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      text-align: center;
      font-style: italic;
      color: rgba(255, 255, 255, 0.75);
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;

      max-width: calc(100% - 24px);
      padding: 7px 10px;

      border-radius: 999px;

      font-family: Arial, sans-serif;
      font-size: 0.76rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .badge-disponible {
      background: #e8f5e9;
      color: #1d5b2b;
    }

    .badge-indisponible {
      background: #f8e5e5;
      color: #7c1f1f;
    }

    .contenu-carte {
      display: flex;
      flex-direction: column;
      flex: 1;

      padding: 21px;
    }

    .titre-produit {
      margin: 0 0 7px;
      font-size: 1.42rem;
      font-weight: normal;
      line-height: 1.2;
    }

    .sous-titre-produit {
      min-height: 1.4em;
      margin: 0 0 18px;

      color: rgba(255, 255, 255, 0.82);
      font-style: italic;
      line-height: 1.35;
    }

    .bas-carte {
      margin-top: auto;
    }

    .prix-produit {
      margin: 0 0 13px;

      color: var(--creme);
      font-family: Georgia, serif;
      font-size: 1.55rem;
      font-weight: bold;
    }

    .bouton-produit {
      display: block;
      width: 100%;

      padding: 13px 16px;

      border: 1px solid var(--creme);
      border-radius: 8px;

      background: var(--creme);
      color: var(--vert-fonce);

      text-align: center;
      text-decoration: none;
      font-weight: bold;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .bouton-produit:hover {
      background: transparent;
      color: var(--blanc);
    }

    footer {
      padding: 24px 15px;

      border-top: 1px solid rgba(255, 255, 255, 0.25);

      background: rgba(20, 55, 32, 0.94);
      text-align: center;
    }

    footer p {
      margin: 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 680px) {
      .barre-superieure {
        align-items: flex-start;
        flex-direction: column;
      }

      .outils {
        width: 100%;
        justify-content: flex-start;
      }

      .conteneur {
        width: min(94%, 560px);
        padding-top: 30px;
      }

      .introduction {
        padding: 25px 18px;
      }

      .titre-categorie {
        gap: 10px;
        letter-spacing: 0.04em;
      }

      .grille-produits {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="barre-superieure">
    <a
      class="marque"
      href="presentation.html"
    >
      Herria Bihotzean
    </a>

    <nav
      class="outils"
      aria-label="Navigation de la boutique"
    >
      <button
        id="bouton-francais"
        class="bouton-langue actif"
        type="button"
      >
        Français
      </button>

      <button
        id="bouton-basque"
        class="bouton-langue"
        type="button"
      >
        Eskuaraz
      </button>

      <a
        class="bouton-retour"
        href="presentation.html"
        id="lien-retour"
      >
        Retour au site
      </a>

      <a
        class="bouton-panier"
        href="panier.html"
        id="lien-panier"
      >
        Panier
        <span
          id="nombre-panier"
          class="nombre-panier"
        >
          0
        </span>
      </a>
    </nav>
  </header>

  <main class="conteneur">
    <section class="introduction">
      <h1 id="titre-page">
        Boutique
      </h1>

      <p id="texte-introduction">
        Découvrez les livres, enregistrements et autres
        ressources proposés par Herria Bihotzean.
      </p>
    </section>

    <section
      id="chargement"
      class="etat-chargement"
      aria-live="polite"
    >
      <div
        class="roue"
        aria-hidden="true"
      ></div>

      <p id="texte-chargement">
        Chargement des produits…
      </p>
    </section>

    <section
      id="erreur"
      class="etat-erreur"
      aria-live="assertive"
      hidden
    >
      <h2 id="titre-erreur">
        Impossible de charger la boutique
      </h2>

      <p id="message-erreur"></p>
    </section>

    <section
      id="boutique-vide"
      class="etat-vide"
      hidden
    >
      <p id="texte-boutique-vide">
        Aucun produit n’est actuellement proposé.
      </p>
    </section>

    <div
      id="catalogue"
      aria-live="polite"
    ></div>
  </main>

  <footer>
    <p>
      Herria Bihotzean
    </p>
  </footer>

  <script src="config.js"></script>
  <script src="boutique.js"></script>
</body>
</html>
