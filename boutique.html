<!DOCTYPE html>
<html
  lang="fr"
  data-title-fr="Boutique — Herria Bihotzean"
  data-title-eu="Denda — Herria Bihotzean"
>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Boutique — Herria Bihotzean</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --vert-fonce: #143720;
      --creme: #f6f3ea;
      --blanc: #ffffff;
      --rouge: #8f1f1f;
      --or: #d7b66f;
      --ombre: rgba(0, 0, 0, 0.34);
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--blanc);

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.70)
        ),
        url("fond-herriabihotzean.jpg");

      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    a,
    button {
      font: inherit;
    }

    a {
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /*
     * La barre de navigation de la boutique est distincte
     * du sélecteur de langue créé automatiquement par langues.js.
     */
    .barre-boutique {
      position: sticky;
      top: 0;
      z-index: 80;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 12px 18px;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.25);

      background:
        rgba(20, 55, 32, 0.95);

      box-shadow:
        0 3px 14px var(--ombre);

      backdrop-filter: blur(7px);
    }

    .marque {
      font-weight: bold;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    .navigation-boutique {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .bouton-navigation,
    .bouton-panier {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 41px;
      padding: 9px 14px;

      border:
        1px solid rgba(255, 255, 255, 0.58);

      border-radius: 7px;

      background: transparent;
      color: var(--blanc);

      text-decoration: none;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .bouton-navigation:hover,
    .bouton-navigation:focus-visible,
    .bouton-panier:hover,
    .bouton-panier:focus-visible {
      background: var(--creme);
      color: var(--vert-fonce);
      transform: translateY(-1px);
      outline: none;
    }

    .nombre-panier {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 24px;
      height: 24px;
      margin-left: 7px;
      padding: 0 6px;

      border-radius: 999px;

      background: var(--rouge);
      color: var(--blanc);

      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .page {
      width: min(1220px, calc(100% - 28px));
      margin: 0 auto;
      padding: 48px 0 70px;
    }

    .introduction {
      width: min(850px, 100%);
      margin: 0 auto 42px;
      padding: 30px 26px;

      border:
        1px solid rgba(255, 255, 255, 0.42);

      border-radius: 10px;

      background:
        rgba(0, 0, 0, 0.58);

      box-shadow:
        0 14px 35px var(--ombre);

      text-align: center;
    }

    .introduction h1 {
      margin: 0 0 14px;

      font-size:
        clamp(2.2rem, 6vw, 3.8rem);

      font-weight: normal;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .introduction p {
      margin: 0;

      font-size: 1.08rem;
      line-height: 1.65;
    }

    .etat {
      width: min(760px, 100%);
      margin: 32px auto;
      padding: 25px;

      border:
        1px solid rgba(255, 255, 255, 0.38);

      border-radius: 10px;

      background:
        rgba(20, 55, 32, 0.93);

      box-shadow:
        0 8px 24px var(--ombre);

      text-align: center;
    }

    .etat-erreur {
      background:
        rgba(110, 25, 25, 0.94);
    }

    .roue {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;

      border:
        4px solid rgba(255, 255, 255, 0.28);

      border-top-color: var(--blanc);
      border-radius: 50%;

      animation:
        tourner 0.8s linear infinite;
    }

    @keyframes tourner {
      to {
        transform: rotate(360deg);
      }
    }

    .categorie {
      margin: 45px 0 56px;
    }

    .titre-categorie {
      display: flex;
      align-items: center;
      gap: 18px;

      margin: 0 0 26px;

      font-size:
        clamp(1.55rem, 3.5vw, 2.3rem);

      font-weight: normal;
      letter-spacing: 0.07em;
      text-align: center;
      text-transform: uppercase;
    }

    .titre-categorie::before,
    .titre-categorie::after {
      content: "";
      flex: 1;
      height: 1px;

      background:
        rgba(255, 255, 255, 0.58);
    }

    .sous-categorie {
      margin: 30px 0;
    }

    .titre-sous-categorie {
      margin: 0 0 18px;
      padding-left: 12px;

      border-left:
        4px solid var(--or);

      font-size: 1.35rem;
      font-weight: normal;
    }

    .grille-produits {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(245px, 1fr)
        );

      gap: 25px;
    }

    .carte-produit {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow: hidden;

      border:
        1px solid rgba(255, 255, 255, 0.46);

      border-radius: 10px;

      background:
        rgba(20, 55, 32, 0.90);

      box-shadow:
        0 12px 30px var(--ombre);

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease;
    }

    .carte-produit:hover {
      transform: translateY(-5px);

      box-shadow:
        0 17px 38px rgba(0, 0, 0, 0.44);
    }

    .zone-photo {
      position: relative;

      width: 100%;
      aspect-ratio: 4 / 3;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.08);
    }

    .photo-produit {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: contain;

      background:
        rgba(255, 255, 255, 0.04);

      transition:
        transform 0.35s ease;
    }

    .carte-produit:hover
    .photo-produit {
      transform: scale(1.035);
    }

    .photo-absente {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;
      padding: 24px;

      color:
        rgba(255, 255, 255, 0.76);

      font-style: italic;
      text-align: center;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;

      max-width:
        calc(100% - 24px);

      padding: 7px 10px;

      border-radius: 999px;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.76rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .badge-disponible {
      background: #e8f5e9;
      color: #1d5b2b;
    }

    .badge-indisponible {
      background: #f8e5e5;
      color: #7c1f1f;
    }

    .contenu-carte {
      display: flex;
      flex: 1;
      flex-direction: column;

      padding: 21px;
    }

    .titre-produit {
      margin: 0 0 7px;

      font-size: 1.42rem;
      font-weight: normal;
      line-height: 1.25;
    }

    .sous-titre-produit {
      min-height: 1.4em;
      margin: 0 0 18px;

      color:
        rgba(255, 255, 255, 0.82);

      font-style: italic;
      line-height: 1.4;
    }

    .bas-carte {
      margin-top: auto;
    }

    .prix-produit {
      margin: 0 0 14px;

      color: var(--creme);

      font-size: 1.55rem;
      font-weight: bold;
    }

    .bouton-produit {
      display: block;
      width: 100%;
      padding: 13px 16px;

      border:
        1px solid var(--creme);

      border-radius: 8px;

      background: var(--creme);
      color: var(--vert-fonce);

      font-weight: bold;
      text-align: center;
      text-decoration: none;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .bouton-produit:hover,
    .bouton-produit:focus-visible {
      background: transparent;
      color: var(--blanc);
      outline: none;
    }

    footer {
      padding: 22px 14px 28px;

      border-top:
        1px solid rgba(255, 255, 255, 0.25);

      background:
        rgba(0, 0, 0, 0.58);

      text-align: center;
    }

    footer p {
      margin: 0;
    }

    @media (max-width: 700px) {
      body {
        background-attachment: scroll;
      }

      .barre-boutique {
        align-items: flex-start;
        flex-direction: column;
      }

      .navigation-boutique {
        width: 100%;
        justify-content: flex-start;
      }

      .page {
        padding-top: 30px;
      }

      .introduction {
        padding: 25px 18px;
      }

      .titre-categorie {
        gap: 10px;
        letter-spacing: 0.04em;
      }

      .grille-produits {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <!--
    Ce fichier contient l’apparence exacte
    des boutons de langue du reste du site.
  -->
  <link
    rel="stylesheet"
    href="langues.css"
  >
</head>

<body>
  <!--
    langues.js ajoutera automatiquement ici,
    au début du body, les boutons avec les blasons.
  -->

  <header class="barre-boutique">
    <a
      class="marque"
      href="index.html"
    >
      Herria Bihotzean
    </a>

    <nav
      class="navigation-boutique"
      aria-label="Navigation de la boutique"
    >
      <a
        id="lien-retour"
        class="bouton-navigation"
        href="index.html"
      >
        Retour au site
      </a>

      <a
        id="lien-panier"
        class="bouton-panier"
        href="panier.html"
      >
        <span id="texte-panier">
          Panier
        </span>

        <span
          id="nombre-panier"
          class="nombre-panier"
        >
          0
        </span>
      </a>
    </nav>
  </header>

  <main class="page">
    <section class="introduction">
      <h1 id="titre-page">
        Boutique
      </h1>

      <p id="texte-introduction">
        Découvrez les livres, enregistrements et autres
        ressources proposés par Herria Bihotzean.
      </p>
    </section>

    <section
      id="chargement"
      class="etat"
      aria-live="polite"
    >
      <div
        class="roue"
        aria-hidden="true"
      ></div>

      <p id="texte-chargement">
        Chargement des produits…
      </p>
    </section>

    <section
      id="erreur"
      class="etat etat-erreur"
      aria-live="assertive"
      hidden
    >
      <h2 id="titre-erreur">
        Impossible de charger la boutique
      </h2>

      <p id="message-erreur"></p>
    </section>

    <section
      id="boutique-vide"
      class="etat"
      hidden
    >
      <p id="texte-boutique-vide">
        Aucun produit n’est actuellement proposé.
      </p>
    </section>

    <div
      id="catalogue"
      aria-live="polite"
    ></div>
  </main>

  <footer>
    <p>
      © Herria Bihotzean
    </p>
  </footer>

  <!-- Adresse de l’API Apps Script -->
  <script src="config.js"></script>

  <!--
    Système commun de langues :
    blasons, libellés et mémorisation.
  -->
  <script src="langues.js"></script>

  <!-- Fonctionnement propre à la boutique -->
  <script src="boutique.js"></script>
</body>
</html>
