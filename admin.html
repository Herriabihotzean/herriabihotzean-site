<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Administration — Herria Bihotzean
  </title>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    [hidden] {
      display: none !important;
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: white;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.70)
        ),
        url("fond-herriabihotzean.jpg");

      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }


    button,
    input,
    textarea,
    a {
      font: inherit;
    }


    a {
      color: inherit;
    }


    /* =========================
       PAGE
       ========================= */

    .page {
      width:
        min(
          850px,
          calc(100% - 28px)
        );

      margin:
        0 auto;
    }


    /* =========================
       EN-TÊTE
       ========================= */

    .entete {
      padding:
        46px 16px 28px;

      text-align: center;
    }


    h1 {
      margin: 0;

      font-size:
        clamp(
          2rem,
          6vw,
          3.8rem
        );

      letter-spacing:
        0.05em;

      text-transform:
        uppercase;
    }


    main {
      padding-bottom: 40px;
    }


    /* =========================
       BLOCS
       ========================= */

    .bloc {
      margin-bottom: 24px;

      padding: 30px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.55
        );

      border-radius: 8px;

      background:
        rgba(
          20,
          55,
          32,
          0.92
        );

      box-shadow:
        0 8px 28px
        rgba(
          0,
          0,
          0,
          0.28
        );
    }


    .introduction {
      margin:
        0 0 26px;

      line-height: 1.6;

      text-align: center;
    }


    /* =========================
       FORMULAIRE
       ========================= */

    .champ {
      margin-bottom: 19px;
    }


    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;
    }


    input,
    textarea {
      width: 100%;

      padding:
        12px 13px;

      border:
        1px solid #ddd;

      border-radius: 6px;

      background: white;

      color: #222;
    }


    textarea {
      min-height: 95px;

      resize: vertical;
    }


    input:focus,
    textarea:focus {
      outline:
        2px solid
        rgba(
          255,
          255,
          255,
          0.65
        );

      outline-offset: 2px;
    }


    /* =========================
       BOUTONS
       ========================= */

    .bouton-principal,
    .bouton-secondaire,
    .bouton-action {
      min-height: 46px;

      padding:
        11px 16px;

      border:
        1px solid white;

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.32
        );

      color: white;

      font-weight: bold;

      cursor: pointer;
    }


    .bouton-principal {
      display: block;

      width: 100%;
    }


    .bouton-principal:hover,
    .bouton-secondaire:hover,
    .bouton-action:hover,
    .bouton-principal:focus-visible,
    .bouton-secondaire:focus-visible,
    .bouton-action:focus-visible {
      background: white;

      color: #222;

      outline: none;
    }


    .bouton-principal:disabled,
    .bouton-secondaire:disabled,
    .bouton-action:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }


    /* =========================
       MESSAGES
       ========================= */

    .message {
      min-height: 24px;

      margin:
        18px 0 0;

      line-height: 1.45;

      text-align: center;

      font-weight: bold;
    }


    .message-erreur {
      color: #ffd8d8;
    }


    .message-succes {
      color: #dcffdf;
    }


    /* =========================
       ADMINISTRATION
       ========================= */

    .administration-ouverte {
      text-align: center;
    }


    .administration-ouverte h2 {
      margin:
        0 0 18px;
    }


    .info-session {
      margin:
        24px 0;

      padding: 17px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.18
        );
    }


    #message-administration {
      margin-bottom: 24px;
    }


    /* =========================
       TABLEAU DE BORD
       ========================= */

    #tableau-bord {
      margin-top: 32px;

      text-align: left;
    }


    #titre-produits {
      margin:
        0 0 18px;

      text-align: center;
    }


    #chargement-produits {
      margin:
        16px 0 22px;
    }


    /* =========================
       PRODUITS
       ========================= */

    .produit-admin {
      margin-bottom: 14px;

      padding: 18px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.18
        );
    }


    .produit-admin:last-child {
      margin-bottom: 0;
    }


    .produit-admin h3 {
      margin:
        0 0 12px;

      font-size: 1.2rem;
    }


    .produit-admin p {
      margin:
        6px 0;
    }


    .stock-nul,
    .stock-faible {
      font-weight: bold;
    }


    .actions-produit {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 17px;
    }


    /* =========================
       OUTILS
       ========================= */

    .outils-admin {
      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

      margin-top: 28px;
    }


    /* =========================
       MODALE
       ========================= */

    .fond-modal {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(
          0,
          0,
          0,
          0.78
        );
    }


    .modal {
      width:
        min(
          560px,
          100%
        );

      max-height:
        calc(100vh - 40px);

      overflow-y: auto;

      padding: 28px;

      border:
        1px solid white;

      border-radius: 8px;

      background:
        #173620;

      box-shadow:
        0 10px 40px
        rgba(
          0,
          0,
          0,
          0.5
        );
    }


    .modal h2 {
      margin-top: 0;

      text-align: center;
    }


    .nom-produit-modal {
      margin:
        18px 0 8px;

      text-align: center;

      font-size: 1.2rem;

      font-weight: bold;
    }


    .stock-modal {
      margin:
        0 0 25px;

      text-align: center;
    }


    .actions-modal {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 25px;
    }


    /* =========================
       RETOUR
       ========================= */

    .retour {
      margin:
        30px 0;

      text-align: center;
    }


    .retour a {
      display: inline-block;

      padding:
        11px 18px;

      border:
        1px solid white;

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.32
        );

      color: white;

      font-weight: bold;

      text-decoration: none;
    }


    .retour a:hover {
      background: white;

      color: #222;
    }


    /* =========================
       PIED DE PAGE
       ========================= */

    footer {
      padding:
        22px 14px 28px;

      border-top:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      background:
        rgba(
          0,
          0,
          0,
          0.58
        );

      text-align: center;
    }


    @media (
      max-width: 700px
    ) {

      body {
        background-attachment: scroll;
      }


      .entete {
        padding:
          28px 8px 18px;
      }


      .bloc {
        padding:
          22px 16px;
      }


      .actions-produit {
        display: grid;
      }


      .bouton-action {
        width: 100%;
      }


      .actions-modal {
        display: grid;
      }
    }

  </style>

</head>


<body>


  <header class="entete">

    <h1>
      Administration
    </h1>

  </header>


  <main class="page">


    <!-- =========================
         CONNEXION
         ========================= -->

    <section
      id="bloc-connexion"
      class="bloc"
    >

      <p class="introduction">
        Identifiez-vous pour accéder à
        l’administration de la boutique.
      </p>


      <form
        id="formulaire-connexion"
        method="post"
        target="_top"
      >

        <input
          type="hidden"
          name="type"
          value="admin-login"
        >


        <input
          id="retour-admin"
          type="hidden"
          name="retourAdmin"
          value="https://herriabihotzean.github.io/herriabihotzean-site/admin.html"
        >


        <div class="champ">

          <label for="identifiant">
            Identifiant
          </label>

          <input
            id="identifiant"
            name="identifiant"
            type="text"
            autocomplete="username"
            required
          >

        </div>


        <div class="champ">

          <label for="mot-de-passe">
            Mot de passe
          </label>

          <input
            id="mot-de-passe"
            name="motDePasse"
            type="password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          id="bouton-connexion"
          class="bouton-principal"
          type="submit"
        >
          Se connecter
        </button>


        <p
          id="message-connexion"
          class="message"
          aria-live="polite"
        ></p>


      </form>

    </section>



    <!-- =========================
         ADMINISTRATION
         ========================= -->

    <section
      id="bloc-administration"
      class="bloc administration-ouverte"
      hidden
    >

      <h2>
        Administration ouverte
      </h2>


      <p>
        La connexion administrateur a réussi.
      </p>


      <div class="info-session">

        Votre session administrateur est active.

      </div>


      <p
        id="message-administration"
        class="message"
        hidden
        aria-live="polite"
      ></p>



      <!-- =========================
           PRODUITS
           ========================= -->

      <div id="tableau-bord">

        <h2 id="titre-produits">
          Produits et stocks
        </h2>


        <p
          id="chargement-produits"
          class="message"
        >
          Chargement des produits…
        </p>


        <div
          id="liste-produits"
        ></div>

      </div>



      <div class="outils-admin">

        <button
          id="bouton-deconnexion"
          class="bouton-secondaire"
          type="button"
        >
          Se déconnecter
        </button>

      </div>

    </section>



    <div class="retour">

      <a href="index.html">
        ← Retour à l'accueil
      </a>

    </div>


  </main>



  <!-- =========================
       RÉAPPROVISIONNEMENT
       ========================= -->

  <div
    id="fond-reapprovisionnement"
    class="fond-modal"
    hidden
  >

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titre-reapprovisionnement"
    >

      <h2 id="titre-reapprovisionnement">
        Réapprovisionnement
      </h2>


      <p
        id="nom-produit-reapprovisionnement"
        class="nom-produit-modal"
      ></p>


      <p
        id="stock-produit-reapprovisionnement"
        class="stock-modal"
      ></p>


      <form
        id="formulaire-reapprovisionnement"
      >

        <div class="champ">

          <label
            for="quantite-reapprovisionnement"
          >
            Quantité reçue *
          </label>

          <input
            id="quantite-reapprovisionnement"
            type="number"
            min="1"
            step="1"
            required
          >

        </div>


        <div class="champ">

          <label
            for="cout-reapprovisionnement"
          >
            Coût total (€)
          </label>

          <input
            id="cout-reapprovisionnement"
            type="number"
            min="0"
            step="0.01"
            value="0"
          >

        </div>


        <div class="champ">

          <label
            for="observation-reapprovisionnement"
          >
            Observation
          </label>

          <textarea
            id="observation-reapprovisionnement"
            placeholder="Ex. : nouvelle impression, livraison fournisseur…"
          ></textarea>

        </div>


        <p
          id="message-reapprovisionnement"
          class="message"
          aria-live="polite"
        ></p>


        <div class="actions-modal">

          <button
            id="annuler-reapprovisionnement"
            class="bouton-secondaire"
            type="button"
          >
            Annuler
          </button>


          <button
            id="valider-reapprovisionnement"
            class="bouton-principal"
            type="submit"
          >
            Valider le réapprovisionnement
          </button>

        </div>

      </form>

    </section>

  </div>



  <footer>
    © Herria Bihotzean
  </footer>


  <script src="config.js"></script>
  <script src="admin.js"></script>


</body>

</html>
