<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Administration — Herria Bihotzean
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: white;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.70)
        ),
        url("fond-herriabihotzean.jpg");

      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    button,
    input,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }


    /* =========================
       PAGE
       ========================= */

    .page {

      width:
        min(
          800px,
          calc(100% - 28px)
        );

      margin:
        0 auto;
    }


    /* =========================
       TITRE
       ========================= */

    .entete {

      padding:
        46px 16px 28px;

      text-align: center;
    }

    h1 {

      margin: 0;

      font-size:
        clamp(
          2rem,
          6vw,
          3.8rem
        );

      letter-spacing:
        0.05em;

      text-transform:
        uppercase;
    }

    main {
      padding-bottom: 40px;
    }


    /* =========================
       BLOCS
       ========================= */

    .bloc {

      margin-bottom: 24px;

      padding: 30px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.55
        );

      border-radius: 8px;

      background:
        rgba(
          20,
          55,
          32,
          0.92
        );

      box-shadow:
        0 8px 28px
        rgba(
          0,
          0,
          0,
          0.28
        );
    }

    .introduction {

      margin:
        0 0 26px;

      line-height: 1.6;

      text-align: center;
    }


    /* =========================
       FORMULAIRE
       ========================= */

    .champ {

      margin-bottom: 19px;
    }

    label {

      display: block;

      margin-bottom: 7px;

      font-weight: bold;
    }

    input {

      width: 100%;

      padding:
        12px 13px;

      border:
        1px solid #ddd;

      border-radius: 6px;

      background: white;

      color: #222;
    }

    input:focus {

      outline:
        2px solid
        rgba(
          255,
          255,
          255,
          0.65
        );

      outline-offset: 2px;
    }


    /* =========================
       BOUTONS
       ========================= */

    .bouton-principal,
    .bouton-secondaire {

      min-height: 50px;

      padding:
        12px 18px;

      border:
        1px solid white;

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.32
        );

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .bouton-principal {

      display: block;

      width: 100%;
    }

    .bouton-principal:hover,
    .bouton-secondaire:hover,
    .bouton-principal:focus-visible,
    .bouton-secondaire:focus-visible {

      background: white;

      color: #222;

      outline: none;
    }

    .bouton-principal:disabled,
    .bouton-secondaire:disabled {

      opacity: 0.55;

      cursor: not-allowed;
    }


    /* =========================
       MESSAGES
       ========================= */

    .message {

      min-height: 24px;

      margin:
        18px 0 0;

      line-height: 1.45;

      text-align: center;

      font-weight: bold;
    }

    .message-erreur {

      color: #ffd8d8;
    }

    .message-succes {

      color: #dcffdf;
    }


    /* =========================
       ADMINISTRATION
       ========================= */

    .administration-ouverte {

      text-align: center;
    }

    .administration-ouverte h2 {

      margin:
        0 0 18px;
    }

    .administration-ouverte p {

      line-height: 1.6;
    }

    .info-session {

      margin:
        24px 0;

      padding: 17px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.18
        );
    }


    /* =========================
       PRODUITS
       ========================= */

    #tableau-bord {

      margin-top: 32px;

      text-align: left;
    }

    #titre-produits {

      margin:
        0 0 18px;

      text-align: center;
    }

    #chargement-produits {

      margin:
        16px 0 22px;
    }

    .produit-admin {

      margin-bottom: 14px;

      padding: 18px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.18
        );
    }

    .produit-admin:last-child {

      margin-bottom: 0;
    }

    .produit-admin h3 {

      margin:
        0 0 12px;

      font-size: 1.2rem;
    }

    .produit-admin p {

      margin:
        6px 0;
    }

    .stock-nul {

      font-weight: bold;
    }

    .stock-faible {

      font-weight: bold;
    }


    /* =========================
       OUTILS
       ========================= */

    .outils-admin {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

      margin-top: 28px;
    }


    /* =========================
       RETOUR
       ========================= */

    .retour {

      margin:
        30px 0;

      text-align: center;
    }

    .retour a {

      display: inline-block;

      padding:
        11px 18px;

      border:
        1px solid white;

      border-radius: 7px;

      background:
        rgba(
          0,
          0,
          0,
          0.32
        );

      color: white;

      font-weight: bold;

      text-decoration: none;
    }

    .retour a:hover {

      background: white;

      color: #222;
    }


    /* =========================
       PIED DE PAGE
       ========================= */

    footer {

      padding:
        22px 14px 28px;

      border-top:
        1px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      background:
        rgba(
          0,
          0,
          0,
          0.58
        );

      text-align: center;
    }


    @media (
      max-width: 700px
    ) {

      body {

        background-attachment: scroll;
      }

      .entete {

        padding:
          28px 8px 18px;
      }

      .bloc {

        padding:
          22px 16px;
      }
    }

  </style>

</head>


<body>


  <header class="entete">

    <h1>
      Administration
    </h1>

  </header>


  <main class="page">


    <!-- =========================
         CONNEXION
         ========================= -->

    <section
      id="bloc-connexion"
      class="bloc"
    >

      <p class="introduction">
        Identifiez-vous pour accéder à
        l’administration de la boutique.
      </p>


      <form
        id="formulaire-connexion"
        method="post"
        target="_top"
      >

        <input
          type="hidden"
          name="type"
          value="admin-login"
        >


        <input
          id="retour-admin"
          type="hidden"
          name="retourAdmin"
          value="https://herriabihotzean.github.io/herriabihotzean-site/admin.html"
        >


        <div class="champ">

          <label for="identifiant">
            Identifiant
          </label>

          <input
            id="identifiant"
            name="identifiant"
            type="text"
            autocomplete="username"
            required
          >

        </div>


        <div class="champ">

          <label for="mot-de-passe">
            Mot de passe
          </label>

          <input
            id="mot-de-passe"
            name="motDePasse"
            type="password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          id="bouton-connexion"
          class="bouton-principal"
          type="submit"
        >
          Se connecter
        </button>


        <p
          id="message-connexion"
          class="message"
          aria-live="polite"
        ></p>


      </form>

    </section>



    <!-- =========================
         ADMINISTRATION OUVERTE
         ========================= -->

    <section
      id="bloc-administration"
      class="bloc administration-ouverte"
      hidden
    >

      <h2>
        Administration ouverte
      </h2>


      <p>
        La connexion administrateur a réussi.
      </p>


      <div class="info-session">

        <p>
          Votre session administrateur est active.
        </p>

      </div>



      <!-- =========================
           PRODUITS
           ========================= -->

      <div id="tableau-bord">

        <h2 id="titre-produits">
          Produits et stocks
        </h2>


        <p
          id="chargement-produits"
          class="message"
        >
          Chargement des produits…
        </p>


        <div
          id="liste-produits"
        ></div>

      </div>



      <div class="outils-admin">

        <button
          id="bouton-deconnexion"
          class="bouton-secondaire"
          type="button"
        >
          Se déconnecter
        </button>

      </div>


    </section>



    <div class="retour">

      <a href="index.html">
        ← Retour à l'accueil
      </a>

    </div>


  </main>


  <footer>
    © Herria Bihotzean
  </footer>

  <iframe
    id="admin-iframe"
    name="admin-iframe"
    hidden
  ></iframe>

  <script src="config.js"></script>
  <script src="admin.js"></script>


</body>

</html>
