<!DOCTYPE html>
<html
  lang="fr"
  data-title-fr="Panier — Herria Bihotzean"
  data-title-eu="Saskia — Herria Bihotzean"
>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panier — Herria Bihotzean</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: white;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.70)
        ),
        url("fond-herriabihotzean.jpg");

      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    a {
      color: inherit;
    }

    button,
    input,
    a {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(1000px, calc(100% - 28px));
      margin: 0 auto;
    }

    /*
     * Même présentation que les titres des autres rubriques :
     * sans cadre, en capitales.
     */
    .entete {
      padding: 46px 16px 26px;
      text-align: center;
    }

    .bloc-titre {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 30px 24px;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(2rem, 6vw, 3.8rem);

      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    main {
      padding-bottom: 40px;
    }

    .panier-vide {
      margin: 0 auto 24px;
      padding: 30px 24px;

      border-radius: 8px;

      background:
        rgba(0, 0, 0, 0.58);

      line-height: 1.65;
      text-align: center;
    }

    .panier-vide p {
      margin: 0 0 22px;
    }

    .liste-panier {
      display: flex;
      flex-direction: column;
      gap: 16px;

      margin-bottom: 28px;
    }

    .article-panier {
      display: grid;

      grid-template-columns:
        140px
        minmax(0, 1fr)
        auto;

      gap: 22px;

      padding: 20px;

      border:
        1px solid rgba(255, 255, 255, 0.60);

      border-radius: 8px;

      background:
        rgba(20, 55, 32, 0.88);
    }

    .zone-photo {
      width: 140px;
      height: 140px;

      overflow: hidden;

      border-radius: 7px;

      background:
        rgba(255, 255, 255, 0.08);
    }

    .photo-produit {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .photo-absente {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;
      padding: 12px;

      color:
        rgba(255, 255, 255, 0.72);

      font-size: 0.9rem;
      font-style: italic;
      text-align: center;
    }

    .informations-article {
      min-width: 0;
    }

    .titre-article {
      margin: 0 0 7px;

      font-size: 1.45rem;
      font-weight: normal;
    }

    .sous-titre-article {
      margin: 0 0 14px;

      color:
        rgba(255, 255, 255, 0.82);

      font-style: italic;
    }

    .prix-unitaire {
      margin: 0 0 16px;

      font-weight: bold;
    }

    .controle-article {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .bloc-quantite {
      display: inline-flex;
      align-items: center;

      overflow: hidden;

      border:
        1px solid rgba(255, 255, 255, 0.55);

      border-radius: 7px;
    }

    .bouton-quantite {
      width: 40px;
      height: 40px;

      border: 0;

      background: white;
      color: #222;

      font-size: 1.25rem;
      font-weight: bold;

      cursor: pointer;
    }

    .champ-quantite {
      width: 55px;
      height: 40px;

      border: 0;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;

      background: white;
      color: #222;

      font-family:
        Arial,
        sans-serif;

      font-weight: bold;
      text-align: center;
    }

    .bouton-supprimer {
      padding: 8px 12px;

      border:
        1px solid rgba(255, 255, 255, 0.65);

      border-radius: 6px;

      background: transparent;
      color: white;

      cursor: pointer;
    }

    .bouton-supprimer:hover,
    .bouton-supprimer:focus-visible {
      background: white;
      color: #7c1f1f;
      outline: none;
    }

    .total-article {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      min-width: 105px;

      font-size: 1.3rem;
      font-weight: bold;
      text-align: right;
    }

    .recapitulatif {
      width: min(580px, 100%);
      margin: 30px 0 30px auto;
      padding: 24px;

      border:
        1px solid rgba(255, 255, 255, 0.60);

      border-radius: 8px;

      background:
        rgba(0, 0, 0, 0.58);
    }

    .ligne-recapitulatif {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      padding: 9px 0;
    }

    .ligne-recapitulatif + .ligne-recapitulatif {
      border-top:
        1px solid rgba(255, 255, 255, 0.20);
    }

    .ligne-sous-total {
      font-size: 1.18rem;
      font-weight: bold;
    }

    .texte-livraison {
      color:
        rgba(255, 255, 255, 0.82);

      font-size: 0.95rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;

      margin: 26px 0;
    }

    .bouton-action {
      display: inline-block;

      padding: 12px 20px;

      border: 1px solid white;
      border-radius: 7px;

      background:
        rgba(0, 0, 0, 0.32);

      color: white;

      font-weight: bold;
      text-align: center;
      text-decoration: none;

      cursor: pointer;
    }

    .bouton-action:hover,
    .bouton-action:focus-visible {
      background: white;
      color: #222;
      outline: none;
    }

    .bouton-commander {
      background:
        rgba(20, 55, 32, 0.95);
    }

    .vider-panier {
      display: block;

      margin: 22px auto 0;
      padding: 8px 12px;

      border: 0;

      background: transparent;
      color:
        rgba(255, 255, 255, 0.80);

      text-decoration: underline;
      text-underline-offset: 4px;

      cursor: pointer;
    }

    .vider-panier:hover {
      color: white;
    }

    /*
     * Même bouton retour que langue-basque.html.
     */
    .retour {
      margin: 30px 0;
      text-align: center;
    }

    .retour a {
      display: inline-block;
      padding: 11px 18px;

      border: 1px solid white;
      border-radius: 7px;

      background:
        rgba(0, 0, 0, 0.32);

      font-weight: bold;
      text-decoration: none;
    }

    .retour a:hover,
    .retour a:focus-visible {
      background: white;
      color: #222;
      outline: none;
    }

    footer {
      padding: 22px 14px 28px;

      border-top:
        1px solid rgba(255, 255, 255, 0.25);

      background:
        rgba(0, 0, 0, 0.58);

      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        background-attachment: scroll;
      }

      .entete {
        padding: 28px 8px 18px;
      }

      .bloc-titre {
        padding: 24px 14px;
      }

      .article-panier {
        grid-template-columns:
          90px minmax(0, 1fr);
      }

      .zone-photo {
        width: 90px;
        height: 90px;
      }

      .total-article {
        grid-column: 1 / -1;

        justify-content: flex-end;

        padding-top: 12px;

        border-top:
          1px solid rgba(255, 255, 255, 0.18);
      }

      .recapitulatif {
        margin-left: 0;
      }
    }
  </style>

  <link
    href="langues.css"
    rel="stylesheet"
  >
</head>

<body>
  <header class="entete">
    <div class="bloc-titre">
      <h1 id="titre-page">
        Panier
      </h1>
    </div>
  </header>

  <main class="page">

    <section
      id="panier-vide"
      class="panier-vide"
      hidden
    >
      <p id="texte-panier-vide">
        Votre panier est vide.
      </p>

      <a
        id="lien-decouvrir"
        class="bouton-action"
        href="boutique.html"
      >
        Découvrir la boutique
      </a>
    </section>

    <div
      id="contenu-panier"
      hidden
    >
      <section
        id="liste-panier"
        class="liste-panier"
      ></section>

      <section class="recapitulatif">

        <div
          class="ligne-recapitulatif ligne-sous-total"
        >
          <span id="etiquette-sous-total">
            Sous-total
          </span>

          <span id="sous-total">
            0,00 €
          </span>
        </div>

        <div class="ligne-recapitulatif">
          <span id="etiquette-expedition">
            Expédition
          </span>

          <span id="valeur-expedition">
            Calculée lors de la commande
          </span>
        </div>

        <p
          id="texte-livraison"
          class="texte-livraison"
        >
          Les éventuels frais de livraison seront calculés
          lors de la commande selon les articles choisis.
        </p>
      </section>

      <div class="actions">
        <a
          id="lien-continuer"
          class="bouton-action"
          href="boutique.html"
        >
          Continuer mes achats
        </a>

        <a
          id="lien-commander"
          class="bouton-action bouton-commander"
          href="commander.html"
        >
          Commander
        </a>
      </div>

      <button
        id="vider-panier"
        class="vider-panier"
        type="button"
      >
        Vider le panier
      </button>
    </div>

    <div class="retour">
      <a
        id="lien-retour"
        href="boutique.html"
      >
        ← Retour à la boutique
      </a>
    </div>

  </main>

  <footer>
    © Herria Bihotzean
  </footer>

  <script src="langues.js"></script>
  <script src="panier.js"></script>
</body>
</html>
